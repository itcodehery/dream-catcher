services:
  - type: web
    name: dream-catcher
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_PATH
        value: /app/data/dreams.db

    # Note: Persistent disks require a paid Render instance.
    # Uncomment below if you attach a persistent disk for SQLite:
    # disk:
    #   name: dream-catcher-data
    #   mountPath: /app/data
    #   sizeGB: 1
